# Flatpak manifest for Nordstjernen. Builds against the GNOME runtime,
# which already supplies GTK 4, libcurl, OpenSSL, SQLite, libpsl, libwebp,
# librsvg, gdk-pixbuf, libepoxy, fontconfig and Pango; only uchardet is built
# as an extra module. See docs/flatpak.md.
app-id: org.nordstjernen.WebBrowser
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: nordstjernen

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=xdg-download

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/man
  - '*.a'
  - '*.la'

modules:
  - name: uchardet
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DBUILD_BINARY=OFF
    sources:
      - type: archive
        url: https://www.freedesktop.org/software/uchardet/releases/uchardet-0.0.8.tar.xz
        sha256: e97a60cfc00a1c147a674b097bb1422abd9fa78a2d9ce3f3fdcc2e78a34ac5f0

  - name: nordstjernen
    buildsystem: meson
    config-opts:
      - --buildtype=release
      - -Db_lto=true
      - -Dai=disabled
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - builddir
          - build-appimage
          - dist
    post-install:
      # Flathub expects the app icon and AppStream id to match the app-id.
      # meson already installed nordstjernen.svg into /app, so copy from there
      # (post-install runs from the meson build dir, not the source root).
      - cp /app/share/icons/hicolor/scalable/apps/nordstjernen.svg
          /app/share/icons/hicolor/scalable/apps/org.nordstjernen.WebBrowser.svg
      - desktop-file-edit --set-icon=org.nordstjernen.WebBrowser
          /app/share/applications/org.nordstjernen.WebBrowser.desktop
